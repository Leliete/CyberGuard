<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CyberGuard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        h1 { color: #1a2a3a; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CYBERGUARD</h1>
        <p class="subtitle">Protege tu mundo digital</p>
        <h2>Iniciar sesión</h2>
        
        <form action="/login" method="POST">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" required>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p class="link">¿No tienes cuenta? <a href="/registro">Crear cuenta</a></p>
    </div>
</body>
</html>
